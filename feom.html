<script>
const SUPABASE_URL='https://pteplorcwsgxkkjhnkyl.supabase.co', SUPABASE_KEY='sb_publishable_lMeVRrrkTQDlAk6oxSy21A_qcRN0slr';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),A=$('#app');
const TEMALAR=['turuncu','mavi','yesil'];
try{document.documentElement.dataset.t=localStorage.getItem('feom_t')||'turuncu'}catch(e){document.documentElement.dataset.t='turuncu'}
function tema(){let t=document.documentElement.dataset.t||'turuncu';t=TEMALAR[(TEMALAR.indexOf(t)+1)%3];document.documentElement.dataset.t=t;try{localStorage.setItem('feom_t',t)}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PERMS={yaz:'Kayıt ekle / düzenle / Excel içe aktar',teslim:'Teslim al (gelen ürün girişi)',foto:'Fotoğraf yükle',rapor:'Rapor oluştur',sil:'Silme / temizleme',onay:'Üye onayı + rol atama',ayar:'Ayarlar (roller, HK, masraf merkezi, kişiler)'};
const PS={yaz:'Kayıt',teslim:'Teslim',foto:'Foto',rapor:'Rapor',sil:'Silme',onay:'Onay',ayar:'Ayar'};
const HL={ambar_stok:'Ambar Stok',koltuk_ambar_stok:'Koltuk Ambar Stok',sarf:'Sarf'};
const SL={bekleyen:'bekleyen',kismi:'kısmi',gelen:'gelen',iptal:'iptal',eksik:'eksik'};
let me=null,P={},tab='ozet',sub='',data=[],kisi={},hk=new Set(),mcs=[],pend=0,yt='uye',rl=[],hkl=[],gh='',gd=[],cf='',catM=[],openM={};
const can=p=>!!P[p];
const bugun=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const kn=c=>{const n=kisi[String(c||'').toUpperCase()];return n?`${n} (${c})`:c};
async function pg(mk){let out=[],f=0;for(;;){const {data:d,error}=await mk().range(f,f+999);if(error)throw error;out=out.concat(d);if(d.length<1000)return out;f+=1000}}
function modal(x){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="card">${x}</div>`;d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d);return d}

// ---------- OTURUM ----------
sb.auth.onAuthStateChange(async ev=>{
  if(ev==='PASSWORD_RECOVERY'){const p=prompt('Yeni şifrenizi yazın (en az 6 karakter):');if(p){const {error}=await sb.auth.updateUser({password:p});alert(error?error.message:'Şifre güncellendi.')}}
});
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return authView();
  const {data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();me=p;
  if(!p||p.status==='pending')return msgView('⏳ Üyeliğiniz Onay Bekliyor','Yönetici onaylayıp rolünüzü atadığında sistemi açabileceksiniz.');
  if(p.status==='rejected')return msgView('⛔ Üyeliğiniz Reddedildi','Lütfen yöneticiyle iletişime geçin.');
  if(!p.unvan)return msgView('🧩 Rolünüz henüz atanmadı','Yönetici rol atadığında sistemi açabileceksiniz.');
  if(p.unvan==='kurucu')P=Object.fromEntries(Object.keys(PERMS).map(k=>[k,true]));
  else{const {data:r}=await sb.from('roller').select('izinler').eq('ad',p.unvan).maybeSingle();P=r?.izinler||{}}
  await refs();appView();
  if(can('sil'))sb.rpc('otomatik_temizle').then(()=>{},()=>{});
}
async function refs(){
  try{const [k,h,m]=await Promise.all([pg(()=>sb.from('kisiler').select('*').order('kod')),pg(()=>sb.from('hizmet_kodlari').select('kod').order('kod')),pg(()=>sb.from('masraf_merkezleri').select('*').order('kod'))]);
    kisi=Object.fromEntries(k.map(x=>[x.kod.toUpperCase(),x.ad]));hk=new Set(h.map(x=>x.kod));mcs=m}catch(e){console.error(e)}
  if(can('onay')){const {count}=await sb.from('profiles').select('id',{count:'exact',head:true}).eq('status','pending');pend=count||0}
}
function msgView(t,m){A.innerHTML=`<div class="card center view"><h2>${t}</h2><p class="mu">${m}</p><button onclick="out()">Çıkış</button> <button class="pri" onclick="boot()">Yenile</button></div>`}
async function out(){await sb.auth.signOut();boot()}
function authView(reg){
  A.innerHTML=`<div class="card center view"><div class="logo" style="font-size:28px;margin-bottom:8px">⚡ FEOM TAKİP</div><div class="mu" style="margin-bottom:10px">Malzeme · Hizmet · Sipariş Takip Sistemi</div>
  ${reg?'<input id="n" placeholder="Ad Soyad" style="width:100%;margin:4px 0">':''}
  <input id="e" type="email" placeholder="E-posta" style="width:100%;margin:4px 0">
  <input id="p" type="password" placeholder="Şifre" style="width:100%;margin:4px 0">
  <button class="pri" style="width:100%;margin:8px 0" id="go">${reg?'Kayıt Ol':'Giriş Yap'}</button>
  <a href="#" id="sw" class="mu">${reg?'Girişe dön':'Kayıt ol'}</a> · <a href="#" id="fg" class="mu">Şifremi unuttum</a><p id="m" class="warn"></p></div>`;
  $('#sw').onclick=e=>{e.preventDefault();authView(!reg)};
  $('#fg').onclick=async e=>{e.preventDefault();const em=$('#e').value;if(!em)return $('#m').textContent='E-posta yazın';
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]});$('#m').textContent=error?error.message:'Sıfırlama bağlantısı e-postanıza gönderildi.'};
  $('#go').onclick=async()=>{const em=$('#e').value,pw=$('#p').value;
    const r=reg?await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:$('#n').value},emailRedirectTo:location.origin+location.pathname.replace(/\/[^\/]*\.html$/,'/').replace(/\/?$/,'/')}}):await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error)return $('#m').textContent=r.error.message;
    if(reg&&!r.data.session){$('#m').style.color='var(--ok)';$('#m').textContent='Kayıt alındı. E-postanızdaki bağlantıyla onaylayın, sonra giriş yapın.';return}
    boot()};
}

// ---------- ANA ÇERÇEVE ----------
const NAV=[['ozet','🏠','Özet','Özet'],['siparis','📦','Siparişler','Sipariş'],['hizmet','🛠','Hizmetler','Hizmet'],['gelen','✅','Gelen Ürünler','Gelen'],['katalog','🗂','Malzeme Kataloğu','Katalog'],['rapor','📧','Güncel Rapor','Rapor']];
function appView(){
  const nav=[...NAV];if(can('onay')||can('ayar')||can('sil'))nav.push(['yonet','⚙️','Yönetim','Yönetim']);
  A.innerHTML=`<header class="top"><div class="logo">⚡ FEOM TAKİP</div><span class="sp"></span><div class="chip">👤 ${esc(me.full_name||me.email)} · <b>${esc(me.unvan)}</b></div><button onclick="tema()" title="Renk teması">🎨</button><button onclick="out()">Çıkış</button></header>
  <div class="acts" id="acts"></div>
  <nav class="nav" id="nav">${nav.map(([k,i,t,s])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')"><span class="ic">${i}</span><span class="tx">${t}</span><span class="sx">${s}</span>${k==='yonet'&&pend?`<i class="bd">${pend}</i>`:''}</button>`).join('')}</nav>
  <div id="sub" class="sub"></div><main id="main" class="view"></main>`;
  new MutationObserver(lab).observe($('#main'),{childList:true,subtree:true});
  ({ozet:ozetView,siparis:listView,hizmet:listView,gelen:gelenView,katalog:catView,rapor:repView,yonet:yonetView})[tab]();
}
const go=k=>{tab=k;sub='';appView()};
function lab(){document.querySelectorAll('#main table').forEach(t=>{const hd=[...t.querySelectorAll('thead th')].map(x=>x.textContent);if(!hd.length)return;

const TH=()=>{const t=(k,l)=>`<th class="sr" onclick="sortBy('${k}')">${l}${F.sort===k?(F.dir==='asc'?' ▲':' ▼'):''}</th>`;return t('talep_no','Talep / KM')+t('tanim2','Tanım')+t('oran','Aşama')+t('masraf_merkezi','Masraf Mrk.')+t('talep_tarihi','Tarih')+'<th>Durum</th><th></th>'};

function sortBy(k){if(F.sort===k)F.dir=F.dir==='asc'?'desc':'asc';else{F.sort=k;F.dir=['talep_tarihi','son_gelis','oran','son_hareket'].includes(k)?'desc':'asc'}$('#fs').value=k;saveF();draw();hdr();dirBtn()}
const sv=(r,k)=>k==='oran'?((r.gelen_adet||0)/(r.miktar||1)):(r[k]??'');
function sorted(v){const k=F.sort,d=F.dir==='asc'?1:-1,rk={bekleyen:0,kismi:0,eksik:0,gelen:1,iptal:2};
  return [...v].sort((a,b)=>{if(k==='akt'){const x=rk[a.durum]-rk[b.durum];if(x)return x;return String(b.son_hareket).localeCompare(String(a.son_hareket))*(d>0?-1:1)}
    const x=sv(a,k),y=sv(b,k);if(x===y)return 0;if(x===''||x==null)return 1;if(y===''||y==null)return -1;
    return (typeof x==='number'?x-y:String(x).localeCompare(String(y),'tr'))*d})}
function view(){const q=($('#q')?.value||'').toLowerCase();
  return sorted(data.filter(r=>okf(r,sub)&&(!F.mm||r.masraf_merkezi===F.mm)&&(!F.te||String(r.talep_eden||'').toUpperCase()===F.te)&&(!F.d1||(r.talep_tarihi||'')>=F.d1)&&(!F.d2||(r.talep_tarihi||'')<=F.d2)&&(!q||[r.talep_no,r.km_kodu,r.tanim,r.tanim2,r.kullanim,r.talep_eden,r.tedarikci,r.masraf_merkezi_adi].join(' ').toLowerCase().includes(q))))}

// aşama göstergesi: 1 Talep → 2 Onay → 3 Siparişte/Hizmette → 4 Teslim
function stage(r){if(r.durum==='iptal')return -1;const k=Number(r.miktar||1),g=r.gelen_adet||0;if(g>=k&&g>0)return 4;if(g>0)return 3.5;const s=String(r.son_durum||'');return s==='100'?1:s==='110'?2:3}

  const s=stage(r),k=SC[r.durum],L=['Talep','Onay',tab==='hizmet'?'Hizmette':'Siparişte',tab==='hizmet'?'Geri geldi':'Teslim'],g=r.gelen_adet||0,mk=r.miktar||1;
  return `<div class="stg" style="--k:${k}">${L.map((t,i)=>`<div class="stp ${s>=i+1?'d':''} ${i+1===Math.ceil(s)&&s<4?'a':''}"><i></i>${t}</div>`).join('')}</div><div class="pb" style="--k:${k}"><b style="width:${Math.min(100,g/mk*100)}%"></b></div><div class="mu" style="font-size:12px;margin-top:3px">${g} / ${mk} adet</div>`}

const who=r=>r.talep_eden?`<div class="mu">👤 ${esc(kn(r.talep_eden))}</div>`:'';

const card=r=>`<div class="card oc ${r.durum==='iptal'?'dim':''}" style="--k:${SC[r.durum]}"><div class="oh"><b>${esc(r.talep_no)}</b><span class="mu">${esc(r.km_kodu)}</span><span class="sp"></span>${chip(r)}</div>

function rd(buf){const txt=new TextDecoder('utf-8').decode(buf);
  if(txt.includes('urn:schemas-microsoft-com:office:spreadsheet')){
    const un=s=>s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&'),rows=[];
    for(const rm of txt.matchAll(/<Row\b[^>]*>([\s\S]*?)<\/Row>/g)){const row=[];
      for(const cm of rm[1].matchAll(/<Cell\b([^>]*?)(?:\/>|>([\s\S]*?)<\/Cell>)/g)){const ix=/ss:Index="(\d+)"/.exec(cm[1]);if(ix)while(row.length<ix[1]-1)row.push('');
        const d=/<Data\b[^>]*>([\s\S]*?)<\/Data>/.exec(cm[2]||'');row.push(d?un(d[1].replace(/<[^>]+>/g,'')):'')}rows.push(row)}
    return rows}
  const wb=XLSX.read(buf,{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}

        masraf_merkezi:s('Maliyet Merkezi'),masraf_merkezi_adi:s('Maliyet Merkezi Adı'),masraf_tipi_kod:s('Masraf Tipi'),masraf_tipi:s('Masraf Tipi Adı'),
        tedarikci:s('Tedarikçi adı'),talep_eden:s('İşlemi başlatan'),satinalmaci:s('Satınalmacı'),son_durum:s('Son durum'),stn_alm_no:s('Stn alm no'),onay_rotasi:s('Onay Rotası'),

        birim_maliyet:bm,tutar:tt,miktar:bm?Math.round(tt/bm)||1:1})}}
  const all=[...map.values()],isI=o=>o.son_durum==='980'||!!o.iptal_tarihi,iptal=all.filter(isI).map(o=>({...o,durum:'iptal'})),diger=all.filter(o=>!isI(o));

  if(a.error)throw a.error;rl=b.data||[];const u=a.data.sort((x,y)=>(x.status==='pending'?0:1)-(y.status==='pending'?0:1));
  pend=u.filter(x=>x.status==='pending').length;
  const opts=sel=>`<option value="">— rol seçin —</option>`+rl.filter(x=>x.ad!=='kurucu').map(x=>`<option ${x.ad===sel?'selected':''}>${esc(x.ad)}</option>`).join('');
  const chips=ad=>{const r=rl.find(x=>x.ad===ad);return Object.keys(PERMS).filter(k=>ad==='kurucu'||r?.izinler?.[k]).map(k=>`<span class="pc">${PS[k]}</span>`).join('')||'<span class="mu">yalnızca görüntüleme</span>'};
  m.innerHTML=`<div class="card"><h3 style="margin-top:0">👥 Üyeler & Onay</h3><p class="mu">Yeni kayıt olanlar en üstte "bekliyor" olarak görünür. Rol seçip <b>Onayla</b>'ya basın; yetkileri o rolden otomatik gelir.</p>
  <div class="tw"><table><thead><tr><th>Ad Soyad</th><th>E-posta</th><th>Durum</th><th>Rol</th><th>Yetkileri</th><th></th></tr></thead><tbody>${u.map(x=>{const fix=x.unvan==='kurucu'||x.id===me.id;
    return `<tr><td><b>${esc(x.full_name)}</b></td><td>${esc(x.email)}</td><td><span class="led ${x.status==='approved'?'gelen':x.status==='pending'?'bekleyen':'eksik'}">${{approved:'onaylı',pending:'bekliyor',rejected:'reddedildi'}[x.status]}</span></td>
    <td>${fix?`<b>${esc(x.unvan)}</b>`:`<select id="rs_${x.id}" ${x.status==='approved'?`onchange="setUnvan('${x.id}',this.value)"`:''}>${opts(x.unvan)}</select>`}</td><td>${x.unvan?chips(x.unvan):''}</td>
    <td class="ac">${fix?'':x.status==='approved'?`<button class="r" onclick="setStat('${x.id}','rejected')">Askıya al</button>`:`<button class="pri" onclick="onayla('${x.id}')">Onayla</button>${x.status==='pending'?`<button class="r" onclick="setStat('${x.id}','rejected')">Reddet</button>`:''}`}</td></tr>`}).join('')}</tbody></table></div></div>`}
async function onayla(id){const v=$('#rs_'+id).value;if(!v)return alert('Önce bir rol seçin.');const {error}=await sb.from('profiles').update({status:'approved',unvan:v}).eq('id',id);error?alert(error.message):(await refs(),yonetView())}
async function setStat(id,s){const {error}=await sb.from('profiles').update({status:s}).eq('id',id);error?alert(error.message):(await refs(),yonetView())}
async function setUnvan(id,v){if(!v)return;const {error}=await sb.from('profiles').update({unvan:v}).eq('id',id);error?alert(error.message):yonetView()}
// -- roller
async function rolV(m){const {data:ro,error}=await sb.from('roller').select('*').order('sira');if(error)throw error;rl=ro;const K=Object.keys(PERMS);
  m.innerHTML=`<div class="card"><h3 style="margin-top:0">🛡 Roller ve Yetkiler</h3><p class="mu">Bir role yetki verdiğinizde o role atanmış herkese otomatik uygulanır. Değişiklik anında kaydedilir.</p>
  <div class="tw"><table><thead><tr><th>Rol</th>${K.map(k=>`<th>${PERMS[k]}</th>`).join('')}<th></th></tr></thead><tbody>${ro.map(r=>`<tr><td><b>${esc(r.ad)}</b></td>${K.map(k=>`<td><label class="sw"><input type="checkbox" data-r="${esc(r.ad)}" ${r.ad==='kurucu'||r.izinler?.[k]?'checked':''} ${r.ad==='kurucu'?'disabled':''} onchange="setPerm(this.dataset.r,'${k}',this.checked)"><i></i></label></td>`).join('')}<td>${r.ad==='kurucu'?'':`<button class="r" data-r="${esc(r.ad)}" onclick="delRol(this.dataset.r)">✕</button>`}</td></tr>`).join('')}</tbody></table></div>
  <div class="bar"><input id="nr" placeholder="Yeni rol adı (örn. teknisyen)"><button class="pri" onclick="addRol()">＋ Rol Ekle</button></div></div>`}
async function setPerm(ad,k,v){const r=rl.find(x=>x.ad===ad),iz={...(r.izinler||{}),[k]:v},{error}=await sb.from('roller').update({izinler:iz}).eq('ad',ad);if(error){alert(error.message);return rolV($('#main'))}r.izinler=iz}
async function addRol(){const ad=$('#nr').value.trim();if(!ad)return;const {error}=await sb.from('roller').insert({ad,izinler:{},sira:(Math.max(0,...rl.map(x=>x.sira))+10)});error?alert(error.message):yonetView()}
async function delRol(ad){if(!confirm(`"${ad}" rolü silinsin mi?`))return;const {error}=await sb.from('roller').delete().eq('ad',ad);error?alert(error.code==='23503'?'Bu role atanmış üyeler var. Önce onların rolünü değiştirin.':error.message):yonetView()}
// -- HK kodları
async function hkV(m){hkl=await pg(()=>sb.from('hizmet_kodlari').select('*').order('kod'));
  m.innerHTML=`<div class="card"><h3 style="margin-top:0">🛠 Hizmet (HK) Kodları <span class="mu">(${hkl.length})</span></h3><p class="mu">Bu listedeki KM kodları <b>Hizmetler</b> sekmesine düşer. Liste değişince "Yeniden Sınıflandır"a basın.</p>
  <div class="bar"><input id="hq" placeholder="Ara"><input id="hk_k" placeholder="Yeni kod (HK002099)"><input id="hk_a" placeholder="Ad"><button class="pri" onclick="hkAdd()">＋ Ekle</button><button onclick="$('#hxf').click()">📥 Excel'den Aktar</button><input id="hxf" type="file" accept=".xls,.xlsx" hidden><button onclick="tipGun()">🔄 Listeleri Yeniden Sınıflandır</button></div>
  <div class="tw" style="max-height:55vh"><table><thead><tr><th>Kod</th><th>Ad</th><th>Ad 2</th><th></th></tr></thead><tbody id="hkb"></tbody></table></div></div>`;
  $('#hq').oninput=hkDraw;$('#hxf').onchange=hkImp;hkDraw()}
function hkDraw(){const q=($('#hq').value||'').toLowerCase();$('#hkb').innerHTML=hkl.filter(x=>(x.kod+' '+x.ad+' '+x.ad2).toLowerCase().includes(q)).slice(0,300).map(x=>`<tr><td><b>${esc(x.kod)}</b></td><td>${esc(x.ad)}</td><td>${esc(x.ad2)}</td><td><button class="r" data-k="${esc(x.kod)}" onclick="hkDel(this.dataset.k)">✕</button></td></tr>`).join('')}
async function hkAdd(){const kod=$('#hk_k').value.trim().toUpperCase();if(!kod)return;const {error}=await sb.from('hizmet_kodlari').upsert({kod,ad:$('#hk_a').value.trim()||null});error?alert(error.message):(await refs(),yonetView())}
async function hkDel(k){if(!confirm(k+' silinsin mi?'))return;const {error}=await sb.from('hizmet_kodlari').delete().eq('kod',k);error?alert(error.message):(await refs(),yonetView())}
async function hkImp(e){const rows=rd(await e.target.files[0].arrayBuffer()),h=rows[0].map(tn),ik=h.indexOf('2. mlz no'),it=h.indexOf('Tanım'),i2=h.indexOf('Tanım satır 2');if(ik<0)return alert('"2. mlz no" sütunu bulunamadı.');
  const l=rows.slice(1).filter(r=>tn(r[ik])).map(r=>({kod:tn(r[ik]).toUpperCase(),ad:tn(r[it])||null,ad2:tn(r[i2])||null}));
  for(let i=0;i<l.length;i+=300){const {error}=await sb.from('hizmet_kodlari').upsert(l.slice(i,i+300));if(error)return alert(error.message)}
  alert(l.length+' kod işlendi.');await refs();yonetView()}
async function tipGun(){const {data:n,error}=await sb.rpc('tip_guncelle');alert(error?error.message:`${n} kayıt yeniden sınıflandırıldı.`)}
// -- masraf merkezleri
async function mmV(m){const {data:l,error}=await sb.from('masraf_merkezleri').select('*').order('kod');if(error)throw error;mcs=l;
  m.innerHTML=`<div class="card"><h3 style="margin-top:0">🏭 Masraf Merkezleri</h3><p class="mu">Üst kodu boş olanlar ana bölgedir (örn. 5500, 5951). Üst kodu olanlar kayıt formunda seçilir.</p>
  <div class="bar"><input id="mm_k" placeholder="Kod (5963)"><input id="mm_a" placeholder="Ad"><input id="mm_u" placeholder="Üst kod"><button class="pri" onclick="mmAdd()">＋ Ekle</button></div>
  <div class="tw"><table><thead><tr><th>Kod</th><th>Ad</th><th>Üst Kod</th><th></th></tr></thead><tbody>${l.map(x=>`<tr><td><b>${esc(x.kod)}</b></td><td><input value="${esc(x.ad)}" id="ma_${esc(x.kod)}"></td><td><input value="${esc(x.ust||'')}" id="mu_${esc(x.kod)}" style="width:100px"></td><td class="ac"><button data-k="${esc(x.kod)}" onclick="mmSave(this.dataset.k)">💾 Kaydet</button><button class="r" data-k="${esc(x.kod)}" onclick="mmDel(this.dataset.k)">✕</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function mmAdd(){const kod=$('#mm_k').value.trim(),ad=$('#mm_a').value.trim();if(!kod||!ad)return alert('Kod ve ad yazın.');const {error}=await sb.from('masraf_merkezleri').upsert({kod,ad,ust:$('#mm_u').value.trim()||null});error?alert(error.message):(await refs(),yonetView())}
async function mmSave(k){const {error}=await sb.from('masraf_merkezleri').update({ad:document.getElementById('ma_'+k).value.trim(),ust:document.getElementById('mu_'+k).value.trim()||null}).eq('kod',k);error?alert(error.message):(await refs(),alert('Kaydedildi.'))}
async function mmDel(k){if(!confirm(k+' silinsin mi?'))return;const {error}=await sb.from('masraf_merkezleri').delete().eq('kod',k);error?alert(error.message):(await refs(),yonetView())}
// -- excel kullanıcı kodları
async function kisiV(m){const {data:l,error}=await sb.from('kisiler').select('*').order('kod');if(error)throw error;kisi=Object.fromEntries(l.map(x=>[x.kod.toUpperCase(),x.ad]));
  const used=new Set((await pg(()=>sb.from('orders').select('talep_eden').order('id'))).map(x=>String(x.talep_eden||'').toUpperCase()).filter(Boolean)),eksik=[...used].filter(c=>!kisi[c]);
  m.innerHTML=`<div class="card"><h3 style="margin-top:0">🧾 Excel Kullanıcı Kodları</h3><p class="mu">Excel'deki "İşlemi başlatan" kodlarının kime ait olduğunu yazın (örn. GGULEC → Görkem). Listelerde isim olarak görünür.</p>
  ${eksik.length?`<div class="bar"><span class="mu">Listede görülen ama tanımsız kodlar:</span>${eksik.map(c=>`<button class="pc" data-c="${esc(c)}" onclick="$('#ki_k').value=this.dataset.c;$('#ki_a').focus()">${esc(c)}</button>`).join('')}</div>`:''}
  <div class="bar"><input id="ki_k" placeholder="Kod (ggulec)"><input id="ki_a" placeholder="İsim (Görkem)"><input id="ki_n" placeholder="Not (isteğe bağlı)"><button class="pri" onclick="kiAdd()">＋ Kaydet</button></div>
  <div class="tw"><table><thead><tr><th>Kod</th><th>İsim</th><th>Not</th><th></th></tr></thead><tbody>${l.map(x=>`<tr><td><b>${esc(x.kod)}</b></td><td>${esc(x.ad)}</td><td>${esc(x.notu)}</td><td class="ac"><button data-k="${esc(x.kod)}" data-a="${esc(x.ad)}" data-n="${esc(x.notu)}" onclick="$('#ki_k').value=this.dataset.k;$('#ki_a').value=this.dataset.a;$('#ki_n').value=this.dataset.n">✏️</button><button class="r" data-k="${esc(x.kod)}" onclick="kiDel(this.dataset.k)">✕</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function kiAdd(){const kod=$('#ki_k').value.trim().toUpperCase(),ad=$('#ki_a').value.trim();if(!kod||!ad)return alert('Kod ve isim yazın.');const {error}=await sb.from('kisiler').upsert({kod,ad,notu:$('#ki_n').value.trim()||null});error?alert(error.message):(await refs(),yonetView())}
async function kiDel(k){if(!confirm(k+' silinsin mi?'))return;const {error}=await sb.from('kisiler').delete().eq('kod',k);error?alert(error.message):(await refs(),yonetView())}
// -- veri saklama
async function veriV(m){const {data:a}=await sb.from('ayarlar').select('*'),g=k=>a?.find(x=>x.anahtar===k)?.deger;
  m.innerHTML=`<div class="card"><h3 style="margin-top:0">🗓 Otomatik Saklama Süresi</h3><p class="mu">Belirlediğiniz aydan eski kayıtlar her gün otomatik silinir (talep tarihine göre). 0 = kapalı.</p>
  <div class="bar"><label class="ck">Son</label><input id="sa" type="number" min="0" value="${g('saklama_ay')||0}" style="width:90px"><label class="ck">ay verisi tutulsun</label><label class="ck"><input id="sbt" type="checkbox" ${g('saklama_sadece_biten')!=='0'?'checked':''}> yalnızca tamamlanmış (gelen/iptal) kayıtlar silinsin</label><button class="pri" onclick="saklamaKaydet()">Kaydet</button></div>
  <div class="mu">Son otomatik temizlik: ${g('son_temizlik')||'—'}</div></div>
  <div class="card" style="margin-top:14px"><h3 style="margin-top:0">🧹 Elle Temizlik</h3><div class="bar">${[3,6,12,24].map(n=>`<button onclick="$('#pm').value=${n}">${n} ay</button>`).join('')}<label class="ck">Şundan eski:</label><input id="pm" type="number" min="1" value="12" style="width:90px"><label class="ck">ay</label><label class="ck"><input id="pb" type="checkbox" checked> yalnızca tamamlanmış kayıtlar</label></div>
  <div class="bar"><button onclick="purge(true)">🔍 Kaç kayıt silinir?</button><button class="r" onclick="purge(false)">🗑 Sil</button></div><p id="pr" class="mu"></p></div>`}
async function saklamaKaydet(){const {error}=await sb.from('ayarlar').upsert([{anahtar:'saklama_ay',deger:String(parseInt($('#sa').value)||0)},{anahtar:'saklama_sadece_biten',deger:$('#sbt').checked?'1':'0'}]);alert(error?error.message:'Kaydedildi.')}
async function purge(say){const ay=parseInt($('#pm').value),bt=$('#pb').checked;if(!(ay>0))return alert('Ay sayısı yazın.');
  const {data:n,error}=await sb.rpc('eski_kayit_sil',{p_ay:ay,p_sadece_biten:bt,p_say:true});if(error)return alert(error.message);
  if(say||n===0){$('#pr').textContent=`${ay} aydan eski ${n} kayıt var.`;return}
  if(prompt(`${ay} aydan eski ${n} kayıt silinecek. Onay için SİL yazın:`)!=='SİL')return;
  const r=await sb.rpc('eski_kayit_sil',{p_ay:ay,p_sadece_biten:bt,p_say:false});$('#pr').textContent=r.error?r.error.message:`${r.data} kayıt silindi.`}

boot();
</script></body></html>
