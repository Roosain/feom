function rd(buf){const txt=new TextDecoder('utf-8').decode(buf);
  if(txt.includes('urn:schemas-microsoft-com:office:spreadsheet')){
    const un=s=>s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&'),rows=[];
    for(const rm of txt.matchAll(/<Row\b[^>]*>([\s\S]*?)<\/Row>/g)){const row=[];
      for(const cm of rm[1].matchAll(/<Cell\b([^>]*?)(?:\/>|>([\s\S]*?)<\/Cell>)/g)){const ix=/ss:Index="(\d+)"/.exec(cm[1]);if(ix)while(row.length<ix[1]-1)row.push('');
        const d=/<Data\b[^>]*>([\s\S]*?)<\/Data>/.exec(cm[2]||'');row.push(d?un(d[1].replace(/<[^>]+>/g,'')):'')}rows.push(row)}
    return rows}

async function catView(){
  $('#acts').innerHTML='';const m=$('#main');m.innerHTML='<div class="mu">Yükleniyor…</div>';
  let mats,op;try{[mats,op]=await Promise.all([pg(()=>sb.from('materials').select('*').order('created_at',{ascending:false}).order('km_kodu')),pg(()=>sb.from('orders').select('km_kodu,tamir_km,tip,durum,talep_no,miktar,gelen_adet,talep_tarihi').in('durum',['bekleyen','kismi','eksik']).order('id'))])}catch(e){return m.innerHTML=`<p class="warn">${esc(e.message)}</p>`}
  catM=mats.filter(x=>/^KM/i.test(x.km_kodu));openM={};op.forEach(o=>{const k=o.tip==='hizmet'?o.tamir_km:o.km_kodu;if(k&&/^KM/i.test(k))(openM[k]=openM[k]||[]).push(o)});
  m.innerHTML=`<div class="bar"><input id="q" placeholder="KM kodu / tanım ara" style="min-width:260px"></div><div id="g" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px"></div>`;
  $('#q').oninput=cdraw;cdraw()}
function cdraw(){const q=($('#q')?.value||'').toLowerCase(),cnt=t=>catM.filter(x=>(openM[x.km_kodu]||[]).some(o=>o.tip===t)).length;
  $('#sub').innerHTML=[['','Tümü','var(--c)',catM.length],['siparis','Siparişte Olanlar','var(--c)',cnt('siparis')],['hizmet','Hizmette Olanlar','var(--c2)',cnt('hizmet')]].map(([k,t,c,n])=>`<button class="sb ${k===cf?'on':''}" style="--k:${c}" onclick="cf='${k}';cdraw()">${t}<b>${n}</b></button>`).join('');
  const v=catM.filter(x=>(x.km_kodu+' '+x.tanim+' '+x.tanim2).toLowerCase().includes(q)&&(!cf||(openM[x.km_kodu]||[]).some(o=>o.tip===cf))).sort((a,b)=>!!openM[b.km_kodu]-!!openM[a.km_kodu]);
  $('#g').innerHTML=v.slice(0,120).map(x=>{const o=openM[x.km_kodu]||[],s=o.filter(i=>i.tip==='siparis'),h=o.filter(i=>i.tip==='hizmet');
    return `<div class="card cat ${o.length?'act':''}"><b>${esc(x.km_kodu)}</b><div>${esc(x.tanim)}</div><div class="mu">${esc(x.tanim2)}</div>
    <div>${s.length?`<button class="bdg" style="--k:var(--c)" onclick="tgl('${esc(x.km_kodu)}','siparis')">🛒 Siparişte ×${s.length}</button>`:''}${h.length?`<button class="bdg" style="--k:var(--c2)" onclick="tgl('${esc(x.km_kodu)}','hizmet')">🛠 Hizmette ×${h.length}</button>`:''}</div>
    <div class="ex" id="ex_${esc(x.km_kodu)}"></div><div class="bar"><button onclick="photos('${esc(x.km_kodu)}')">🖼 Fotoğraflar</button>${can('foto')?`<button class="pri" onclick="up('${esc(x.km_kodu)}')">📷 Fotoğraf Ekle</button>`:''}</div><div class="ph" id="p_${esc(x.km_kodu)}"></div></div>`}).join('')||'<span class="mu">Sonuç yok</span>'}
function tgl(km,tip){const el=document.getElementById('ex_'+km),k=km+tip;if(el.dataset.o===k){el.innerHTML='';el.dataset.o='';return}el.dataset.o=k;
  el.innerHTML=(openM[km]||[]).filter(o=>o.tip===tip).map(o=>`<div class="li"><b>${esc(o.talep_no)}</b><span>${o.gelen_adet||0} / ${o.miktar} adet</span><span class="mu">${o.talep_tarihi||''}</span><span class="led ${o.durum}">${SL[o.durum]}</span></div>`).join('')}
async function photos(km){const el=document.getElementById('p_'+km),{data:p}=await sb.from('photos').select('id,path').eq('km_kodu',km);
  if(!p?.length){el.innerHTML='<span class="mu">Fotoğraf yok</span>';return}
  const {data:u}=await sb.storage.from('photos').createSignedUrls(p.map(x=>x.path),3600);
  el.innerHTML=u.map((x,i)=>`<div><a href="${x.signedUrl}" target="_blank"><img src="${x.signedUrl}"></a>${can('sil')?`<br><button class="r" onclick="dph(${p[i].id},'${p[i].path}','${esc(km)}')">Sil</button>`:''}</div>`).join('')}
async function dph(id,path,km){if(!confirm('Fotoğraf silinsin mi?'))return;const a=await sb.storage.from('photos').remove([path]);if(a.error)return alert(a.error.message);await sb.from('photos').delete().eq('id',id);photos(km)}
async function sikistir(file){const bmp=await createImageBitmap(file),s=Math.min(1,1080/bmp.width),c=document.createElement('canvas');c.width=bmp.width*s;c.height=bmp.height*s;c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  let q=.85,b;do{b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));q-=.08}while(b.size>120*1024&&q>.3);return b}
function up(km){const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=async()=>{
  for(const f of i.files){const b=await sikistir(f),path=`${km}/${Date.now()}_${Math.random().toString(36).slice(2,6)}.jpg`;
    const a=await sb.storage.from('photos').upload(path,b,{contentType:'image/jpeg'});if(a.error){alert(a.error.message);return}
    const {error}=await sb.from('photos').insert({km_kodu:km,path});if(error){alert(error.message);return}}
  if(document.getElementById('p_'+km))photos(km);else alert('✅ Fotoğraflar eklendi. Malzeme Kataloğu > '+km+' kartında görebilirsiniz.')};i.click()}

// ---------- GÜNCEL RAPOR ----------
async function repView(){
  $('#acts').innerHTML='';
  $('#main').innerHTML=`<div class="card"><h3 style="margin-top:0">📧 Güncel Rapor</h3><p class="mu">Son rapordan bu yana eklenen, hizmete giden ve teslim alınan kalemlerden Outlook uyumlu e-posta taslağı üretir.</p>${can('rapor')?'<button class="pri" id="rb">📧 Güncel Rapor Oluştur</button>':'<p class="mu">Rapor oluşturma yetkiniz yok.</p>'}<div id="rep" hidden style="margin-top:12px"></div><button id="cp" hidden style="margin-top:8px">📋 Kopyala</button></div>`;
  if(!can('rapor'))return;$('#rb').onclick=async()=>{
    const {data:l}=await sb.from('report_log').select('created_at').order('created_at',{ascending:false}).limit(1);const since=l?.[0]?.created_at||'1970-01-01';
    let o,gel;try{o=await pg(()=>sb.from('orders').select('*').gt('created_at',since).order('id'));gel=await pg(()=>sb.from('receipts').select('*,orders(talep_no,km_kodu,tanim,tanim2,miktar,gelen_adet)').gt('created_at',since).order('id'))}catch(e){return alert(e.message)}
    const yeni=o.filter(r=>r.tip==='siparis'),hiz=o.filter(r=>r.tip==='hizmet');
    const T='<table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;font:12px Arial">';
    const tb=(rs,ex)=>rs.length?`${T}<tr style="background:#eee"><th>Talep No</th><th>KM Kodu</th><th>Tanım</th><th>Miktar</th><th>Masraf Mrk.</th><th>Talep Tarihi</th>${ex?'<th>Tamire Giden KM</th><th>Seri No</th>':''}</tr>${rs.map(r=>`<tr><td>${esc(r.talep_no)}</td><td>${esc(r.km_kodu)}</td><td>${esc(r.tanim)} ${esc(r.tanim2)}</td><td>${r.miktar}</td><td>${esc(r.masraf_merkezi)}</td><td>${r.talep_tarihi||''}</td>${ex?`<td>${esc(r.tamir_km)}</td><td>${esc(r.seri_no)}</td>`:''}</tr>`).join('')}</table>`:'<i>Değişiklik yok.</i>';
    const tg=rs=>rs.length?`${T}<tr style="background:#eee"><th>Talep No</th><th>KM Kodu</th><th>Tanım</th><th>Gelen Adet</th><th>Geliş Tarihi</th><th>Nereye</th><th>Toplam Gelen / Sipariş</th><th>Durum</th></tr>${rs.map(x=>{const q=x.orders||{};return `<tr><td>${esc(q.talep_no)}</td><td>${esc(q.km_kodu)}</td><td>${esc(q.tanim)} ${esc(q.tanim2)}</td><td>${x.adet}</td><td>${x.tarih}</td><td>${HL[x.hedef]}</td><td>${q.gelen_adet} / ${q.miktar}</td><td>${q.gelen_adet>=q.miktar?'Tamamı geldi':'Kısmi, kalan '+(q.miktar-q.gelen_adet)}</td></tr>`}).join('')}</table>`:'<i>Değişiklik yok.</i>';
    const h=`<div style="font:14px Arial"><p>Merhaba,</p><p>Güncel malzeme listesi bilgilerinize sunulmuştur. Yapılan değişiklikler:</p>${tb(yeni)}<p>Yukarıdaki kalemler sipariş listesine eklendi.</p>${tb(hiz,1)}<p>Yukarıdaki kalemler tamire/hizmete gidecekler listesine eklendi.</p>${tg(gel)}<p>Yukarıdaki kalemler siparişten gelenler listesine eklendi.</p><p>Saygılarımla.</p></div>`;
    $('#rep').innerHTML=h;$('#rep').hidden=false;$('#cp').hidden=false;await sb.from('report_log').insert({});
    $('#cp').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([h],{type:'text/html'})})]);alert('Kopyalandı. Outlook\'a yapıştırın.')}catch(e){const r=document.createRange();r.selectNode($('#rep'));getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand('copy');alert('Kopyalandı.')}}}}

// ---------- YÖNETİM ----------
async function yonetView(){
  $('#acts').innerHTML='';const T=[];
  if(can('onay'))T.push(['uye','👥 Üyeler & Onay']);
  if(can('ayar'))T.push(['rol','🛡 Roller & Yetkiler'],['hk','🛠 HK Kodları'],['mm','🏭 Masraf Merkezleri'],['kisi','🧾 Excel Kullanıcı Kodları']);
  if(can('sil'))T.push(['veri','🗑 Veri Saklama & Temizlik']);
  if(can('vardiya'))T.push(['vardiya','📅 Vardiya & Ekipler']);
  if(!T.find(x=>x[0]===yt))yt=T[0][0];
  $('#sub').innerHTML=T.map(([k,t])=>`<button class="sb ${k===yt?'on':''}" style="--k:var(--c)" onclick="yt='${k}';yonetView()">${t}${k==='uye'&&pend?` <b>${pend}</b>`:''}</button>`).join('');
  const m=$('#main');m.innerHTML='<div class="mu">Yükleniyor…</div>';
  try{await ({uye:uyeV,rol:rolV,hk:hkV,mm:mmV,kisi:kisiV,veri:veriV,vardiya:vardV})[yt](m)}catch(e){m.innerHTML=`<p class="warn">${esc(e.message)}</p>`}
}

let EK=[],PE=[],OZ={},VA='2026-10-19',VR='1',vOff=0,vF='all',vMode='gun',vMon=new Date().toISOString().slice(0,7);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

async function ozFetch(a,b){const o=await pg(()=>sb.from('vardiya_ozel').select('*').gte('tarih',a).lte('tarih',b).order('tarih').order('personel_id')),m={};o.forEach(x=>m[x.personel_id+'|'+x.tarih]=x);return m}

function rot(e,date){if(e.tur==='serbest')return null;if(e.tur==='gunduz'){const w=new Date(date+'T12:00:00').getDay();return w===0||w===6?'HT':'GUNDUZ'}
  const diff=Math.round((Date.parse(date+'T00:00:00Z')-Date.parse(VA+'T00:00:00Z'))/864e5),i=(((diff+e.ofset)%8)+8)%8;return i<2?'V1':i<4?'V2':i<6?'V3':'HT'}
function eff(p,date,mp){const o=(mp||OZ)[p.id+'|'+date];if(o)return o.tip;if(VR==='0')return null;const e=EK.find(x=>x.ad===p.ekip);return e?rot(e,date):null}

function vExpForm(){const t=new Date();
  const m=modal(`<h3>📤 Vardiya Çizelgesini Dışa Aktar</h3><div class="mu">Excel'inizdeki düzenle aynı: her ay ayrı blok ("tarihler ->" satırı, altında isimler). Aynı dosyayı <b>İçe Aktar</b> ile geri yükleyebilirsiniz. Fazla mesailer ayrı bir "Mesai" sayfasında gelir.</div>
  <div class="fg"><div><label>Başlangıç tarihi</label><input id="x_b" type="date" value="${dstr(addD(t,-365))}"></div><div><label>Bitiş tarihi</label><input id="x_e" type="date" value="${dstr(t)}"></div></div>
  <div class="bar"><button data-y="365">Son 1 yıl</button><button data-y="90">Son 3 ay</button><button data-y="-30">Önümüzdeki 30 gün (doldurulacak şablon)</button></div>
  <label class="ck"><input id="x_r" type="checkbox"> Çizelgesi girilmemiş günleri rotasyon tahminiyle doldur</label>
  <p id="x_m" class="mu"></p><div class="bar"><button class="pri" id="x_ok">📤 İndir (.xlsx)</button><button class="r" id="x_x">Kapat</button></div>`);
  const q=s=>m.querySelector(s);
  m.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{const y=+b.dataset.y,n=new Date();if(y>0){q('#x_b').value=dstr(addD(n,-y));q('#x_e').value=dstr(n)}else{q('#x_b').value=dstr(n);q('#x_e').value=dstr(addD(n,-y))}});
  q('#x_x').onclick=()=>m.remove();
  q('#x_ok').onclick=async()=>{const b=q('#x_b').value,e=q('#x_e').value;if(!b||!e||b>e)return q('#x_m').textContent='Geçerli bir tarih aralığı seçin.';
    if((Date.parse(e)-Date.parse(b))/864e5>800)return q('#x_m').textContent='En fazla yaklaşık 2 yıllık aralık seçin.';
    q('#x_m').textContent='Hazırlanıyor…';try{await vExport(b,e,q('#x_r').checked);m.remove()}catch(er){q('#x_m').textContent=er.message}}}
async function vExport(b,e,inc){if(!PE.length)await vload();const mp=await ozFetch(b,e);
  const days=[];for(let d=new Date(b+'T12:00:00');dstr(d)<=e;d=addD(d,1))days.push(dstr(d));
  const LB={V1:'8-16',V2:'16-24',V3:'0-8',GUNDUZ:'GÜNDÜZ',HT:'HAFTA TATİLİ',YI:'YILLIK İZİN',RAPOR:'RAPOR',EGITIM:'EĞİTİM',IDARI:'İDARİ İZİN',RT:'RESMİ TATİL'};
  const people=EK.flatMap(x=>PE.filter(p=>p.aktif&&p.ekip===x.ad).map(p=>({p,e:x}))),rows=[],mons=[...new Set(days.map(d=>d.slice(0,7)))];
  mons.forEach(mo=>{const md=days.filter(d=>d.startsWith(mo));rows.push([`${AY[+mo.slice(5)-1].toLocaleUpperCase('tr')} ${mo.slice(0,4)}`]);
    rows.push(['tarihler ->','Ekip','Görev',...md.map(d=>d.split('-').reverse().join('.'))]);
    people.forEach(({p,e:x})=>rows.push([p.ad.toLocaleUpperCase('tr'),x.ad,p.gorev,...md.map(d=>{const t=inc?eff(p,d,mp):mp[p.id+'|'+d]?.tip;return t?LB[t]:''})]));rows.push([])});
  const ms=[['Personel','Tarih','Mesai (sa)','Not']];
  people.forEach(({p})=>days.forEach(d=>{const o=mp[p.id+'|'+d];if(o&&(o.mesai>0||o.notu))ms.push([p.ad.toLocaleUpperCase('tr'),d.split('-').reverse().join('.'),o.mesai,o.notu||''])}));
  const ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();ws['!cols']=[{wch:26},{wch:12},{wch:10},...Array(32).fill({wch:13})];
  XLSX.utils.book_append_sheet(wb,ws,'Çizelge');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ms),'Mesai');XLSX.writeFile(wb,`vardiya_${b}_${e}.xlsx`)}
// ----- Excel'den çizelge içe aktarma (Sheet1 düzeni: "tarihler ->" satırı + isim satırları, hücrelerde 8-16 / 16-24 / HAFTA TATİLİ / YILLIK İZİN) -----
const nk=s=>String(s||'').toLocaleUpperCase('tr').replace(/İ/g,'I').replace(/Ş/g,'S').replace(/Ğ/g,'G').replace(/Ü/g,'U').replace(/Ö/g,'O').replace(/Ç/g,'C').replace(/\s+/g,' ').trim();
function mapTip(v){const s=nk(v).replace(/\s/g,'');if(!s||/^\?+$/.test(s))return null;
  const m=s.match(/^(\d{1,2})(?:[.:]00)?-(\d{1,2})(?:[.:]00)?$/);
  if(m){const a=+m[1],b=+m[2];if(a===8&&b===16)return'V1';if(a===16&&(b===24||b===0))return'V2';if((a===0||a===24)&&b===8)return'V3';return null}
  if(s.includes('HAFTATATIL'))return'HT';if(s.includes('GUNDUZ'))return'GUNDUZ';if(s.includes('IDARI'))return'IDARI';if(s.includes('IZIN'))return'YI';if(s.includes('RAPOR'))return'RAPOR';if(s.includes('EGITIM'))return'EGITIM';if(s.includes('RESMI'))return'RT';return null}
const dd=v=>{if(v instanceof Date){const d=new Date(v.getTime()+12*36e5);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  const m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(v).trim());return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:null};
function vImpPick(){const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls';i.onchange=async()=>{if(!i.files[0])return;try{await vImport(i.files[0])}catch(e){alert('İçe aktarılamadı: '+e.message)}};i.click()}
async function vImport(f){const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true}),ent=new Map(),msl=[];let atl=0;
  wb.SheetNames.forEach(n=>{if(nk(n)==='MESAI'){XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}).slice(1).forEach(r=>{const d=dd(r[1])||(String(r[1]).match(/^\d{4}-\d{2}-\d{2}/)||[null])[0];if(r[0]&&d&&(parseFloat(r[2])>0||r[3]))msl.push({nm:nk(r[0]),tarih:d,mesai:parseFloat(r[2])||0,notu:String(r[3]||'')||null})});return}const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});let hd=null;
    rows.forEach(r=>{if(String(r[0]).toLocaleLowerCase('tr').includes('tarihler')){hd=r.map(dd);return}
      const nm=nk(r[0]);if(!hd||!nm)return;r.forEach((v,c)=>{if(c<1||!hd[c]||v===''||v==null)return;const t=mapTip(v);if(!t){atl++;return}ent.set(nm+'|'+hd[c],{nm,tarih:hd[c],tip:t})})})});
  if(!ent.size)return alert('Çizelge bulunamadı. Dosyada "tarihler ->" satırı ve altında isim satırları olmalı.');
  await vload();const byN=Object.fromEntries(PE.map(p=>[nk(p.ad),p])),bil=[...new Set([...ent.values()].map(x=>x.nm).filter(x=>!byN[x]))];
  if(bil.length){if(!confirm(`Listede olmayan kişiler: ${bil.join(', ')}.\nPersonel olarak eklensin mi? ("Diğer" ekibine eklenir)`))return;
    if(!EK.some(e=>e.ad==='Diğer')){const {error}=await sb.from('ekipler').insert({ad:'Diğer',tur:'serbest',ofset:0,sira:90});if(error)return alert(error.message)}
    const {error}=await sb.from('personel').insert(bil.map((x,i)=>({ad:x.toLocaleLowerCase('tr').replace(/(^|\s)\S/g,c=>c.toLocaleUpperCase('tr')),gorev:'Usta',ekip:'Diğer',sira:200+i})));if(error)return alert(error.message);await vload();PE.forEach(p=>byN[nk(p.ad)]=p)}
  msl.forEach(x=>{const k=x.nm+'|'+x.tarih,e=ent.get(k);if(e){e.mesai=x.mesai;e.notu=x.notu}else{const p=byN[x.nm],t=p&&eff(p,x.tarih);if(t)ent.set(k,{nm:x.nm,tarih:x.tarih,tip:t,mesai:x.mesai,notu:x.notu})}});
  const all=[...ent.values()].filter(x=>byN[x.nm]),A=all.filter(x=>x.mesai==null).map(x=>({personel_id:byN[x.nm].id,tarih:x.tarih,tip:x.tip})),B=all.filter(x=>x.mesai!=null).map(x=>({personel_id:byN[x.nm].id,tarih:x.tarih,tip:x.tip,mesai:x.mesai,notu:x.notu})),rows=[...A,...B];
  for(const part of [A,B])for(let i=0;i<part.length;i+=300){const {error}=await sb.from('vardiya_ozel').upsert(part.slice(i,i+300));if(error)return alert(error.message)}
  alert(`${rows.length} günlük kayıt işlendi${atl?` (${atl} hücre tanınmadı, atlandı)`:''}.\nÇizelge girilmeyen günlerde rotasyon tahmini görünmesini istemiyorsanız Yönetim > Vardiya & Ekipler'den kapatın.`);
  await vload();vDraw()}
// -- yönetim: vardiya & ekipler
async function vardV(m){await vload();const gor=['Formen','Usta','Mühendis','Diğer'];
  m.innerHTML=`<div class="card"><h3 style="margin-top:0">📅 Rotasyon Ayarı</h3><p class="mu">Vardiyalı ekipler 8 günlük döngüyle döner: 2 gün 08:00-16:00, 2 gün 16:00-24:00, 2 gün 00:00-08:00, 2 gün tatil. Her ekibin "başlangıç kaydırması" onun bu döngünün neresinde olduğunu belirler. Gerçek çizelge farklıysa tarihi ve kaydırmaları düzeltin. Tek günlük değişiklikler (izin, mesai, vardiya değişimi) Vardiya sayfasında hücreye tıklanarak yapılır.</p>
  <div class="bar"><label class="ck">Döngü başlangıç tarihi</label><input id="va" type="date" value="${esc(VA)}"><label class="ck"><input id="vr" type="checkbox" ${VR!=='0'?'checked':''}> Çizelge girilmemiş günlerde rotasyon tahminini göster</label><button class="pri" onclick="vaSave()">Kaydet</button></div></div>
  <div class="card" style="margin-top:14px"><h3 style="margin-top:0">👥 Ekipler</h3><div class="tw"><table><thead><tr><th>Ekip</th><th>Tür</th><th>Başlangıç kaydırması</th><th></th></tr></thead><tbody>${EK.map(e=>`<tr><td><b>${esc(e.ad)}</b></td><td>${e.tur==='gunduz'?'Gündüz (hafta içi 08:00-17:30)':e.tur==='serbest'?'Serbest (rotasyonsuz)':'Vardiyalı'}</td><td>${e.tur!=='vardiya'?'—':`<select data-a="${esc(e.ad)}" onchange="eUpd(this.dataset.a,'ofset',+this.value)">${[[0,'Başlangıç tarihinde 08:00-16:00'],[2,'Başlangıç tarihinde 16:00-24:00'],[4,'Başlangıç tarihinde 00:00-08:00'],[6,'Başlangıç tarihinde tatil']].map(([v,t])=>`<option value="${v}" ${v===e.ofset?'selected':''}>${t}</option>`).join('')}</select>`}</td><td><button class="r" data-a="${esc(e.ad)}" onclick="eDel(this.dataset.a)">✕</button></td></tr>`).join('')}</tbody></table></div>
  <div class="bar"><input id="e_a" placeholder="Yeni ekip adı"><select id="e_t"><option value="vardiya">Vardiyalı</option><option value="gunduz">Gündüz</option><option value="serbest">Serbest (rotasyonsuz)</option></select><select id="e_o"><option value="0">08-16 ile başlar</option><option value="2">16-24 ile başlar</option><option value="4">00-08 ile başlar</option><option value="6">Tatille başlar</option></select><button class="pri" onclick="eAdd()">＋ Ekip Ekle</button></div></div>
  <div class="card" style="margin-top:14px"><h3 style="margin-top:0">🧑‍🔧 Personel</h3><div class="bar"><input id="p_a" placeholder="Ad Soyad"><select id="p_g">${gor.map(g=>`<option>${g}</option>`).join('')}</select><select id="p_e">${EK.map(e=>`<option>${esc(e.ad)}</option>`).join('')}</select><button class="pri" onclick="pAdd()">＋ Personel Ekle</button></div>
  <div class="tw"><table><thead><tr><th>Ad</th><th>Görev</th><th>Ekip</th><th>Aktif</th><th></th></tr></thead><tbody>${PE.map(p=>`<tr><td><input value="${esc(p.ad)}" data-i="${p.id}" onchange="pUpd(this.dataset.i,'ad',this.value)"></td><td><select data-i="${p.id}" onchange="pUpd(this.dataset.i,'gorev',this.value)">${gor.map(g=>`<option ${g===p.gorev?'selected':''}>${g}</option>`).join('')}</select></td><td><select data-i="${p.id}" onchange="pUpd(this.dataset.i,'ekip',this.value)">${EK.map(e=>`<option ${e.ad===p.ekip?'selected':''}>${esc(e.ad)}</option>`).join('')}</select></td><td><label class="sw"><input type="checkbox" data-i="${p.id}" ${p.aktif?'checked':''} onchange="pUpd(this.dataset.i,'aktif',this.checked)"><i></i></label></td><td><button class="r" data-i="${p.id}" onclick="pDel(this.dataset.i)">✕</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function vaSave(){const {error}=await sb.from('ayarlar').upsert([{anahtar:'vardiya_baslangic',deger:$('#va').value},{anahtar:'vardiya_rotasyon',deger:$('#vr').checked?'1':'0'}]);alert(error?error.message:'Kaydedildi.')}
async function eUpd(ad,k,v){const {error}=await sb.from('ekipler').update({[k]:v}).eq('ad',ad);if(error)alert(error.message)}
async function eAdd(){const ad=$('#e_a').value.trim();if(!ad)return;const {error}=await sb.from('ekipler').insert({ad,tur:$('#e_t').value,ofset:+$('#e_o').value,sira:Math.max(0,...EK.map(x=>x.sira))+10});error?alert(error.message):yonetView()}
async function eDel(ad){if(!confirm(ad+' ekibi silinsin mi? Üyeleri ekipsiz kalır.'))return;const {error}=await sb.from('ekipler').delete().eq('ad',ad);error?alert(error.message):yonetView()}
async function pAdd(){const ad=$('#p_a').value.trim();if(!ad)return;const {error}=await sb.from('personel').insert({ad,gorev:$('#p_g').value,ekip:$('#p_e').value||null,sira:Math.max(0,...PE.map(x=>x.sira))+10});error?alert(error.message):yonetView()}
async function pUpd(id,k,v){const {error}=await sb.from('personel').update({[k]:v}).eq('id',id);if(error)alert(error.message)}
async function pDel(id){if(!confirm('Personel silinsin mi? Çizelge kayıtları da silinir.'))return;const {error}=await sb.from('personel').delete().eq('id',id);error?alert(error.message):yonetView()}

// ---------- TARİH ARALIĞINA GÖRE SİLME ----------
function silAralik(tip0){
  const m=modal(`<h3>🗑 Tarih Aralığına Göre Sil</h3><div class="mu">Seçtiğiniz aralıktaki kayıtlar silinir (talep tarihine göre, başlangıç ve bitiş günü dahil). Aralığın dışına dokunulmaz.</div>
  <div class="fg"><div><label>Silinmeye başlanacak tarih</label><input id="s_b" type="date"></div><div><label>Silme duracak tarih</label><input id="s_e" type="date"></div></div>
  <label>Hangi liste?</label><select id="s_t"><option value="">Siparişler ve Hizmetler</option><option value="siparis">Sadece Siparişler</option><option value="hizmet">Sadece Hizmetler</option></select>
  <label class="ck" style="margin-top:10px"><input id="s_k" type="checkbox"> yalnızca tamamlanmış (gelen / iptal) kayıtlar</label>
  <p id="s_r" class="mu"></p><div class="bar"><button id="s_c">🔍 Kaç kayıt silinir?</button><button class="r" id="s_d">🗑 Sil</button><button id="s_x">Vazgeç</button></div>`);
  const q=s=>m.querySelector(s);q('#s_t').value=tip0||'';
  const arg=say=>({p_bas:q('#s_b').value,p_bit:q('#s_e').value,p_tip:q('#s_t').value||null,p_sadece_biten:q('#s_k').checked,p_say:say});
  const ok=()=>{const a=arg(true);if(!a.p_bas||!a.p_bit){q('#s_r').textContent='Önce iki tarihi de seçin.';return false}if(a.p_bas>a.p_bit){q('#s_r').textContent='Başlangıç tarihi bitiş tarihinden büyük olamaz.';return false}return true};
  q('#s_x').onclick=()=>m.remove();
  q('#s_c').onclick=async()=>{if(!ok())return;const {data:n,error}=await sb.rpc('aralik_kayit_sil',arg(true));q('#s_r').textContent=error?error.message:`${q('#s_b').value} → ${q('#s_e').value} arasında ${n} kayıt var.`};
  q('#s_d').onclick=async()=>{if(!ok())return;const {data:n,error}=await sb.rpc('aralik_kayit_sil',arg(true));if(error)return q('#s_r').textContent=error.message;
    if(!n)return q('#s_r').textContent='Bu aralıkta silinecek kayıt yok.';
    if(prompt(`${q('#s_b').value} → ${q('#s_e').value} arasındaki ${n} kayıt silinecek. Bu işlem geri alınamaz.\nOnay için SİL yazın:`)!=='SİL')return;
    const r=await sb.rpc('aralik_kayit_sil',arg(false));if(r.error)return q('#s_r').textContent=r.error.message;
    alert(`${r.data} kayıt silindi.`);m.remove();if(['siparis','hizmet'].includes(tab)&&$('#tb'))listView()};
}

boot();
